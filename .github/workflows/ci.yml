# SessionBridge CI: cross-platform tests, static checks, and release artifacts.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract tests (golden + clients)
        run: python tests/test_contract.py

      - name: Encoding gate
        run: python tools/enforce_encoding.py

      - name: JS syntax check
        run: node --check extension/extension.js

      - name: Python package build/install smoke (pip)
        run: |
          python -m pip install --no-deps .
          sessbridge --help
          python -c "import sessbridge"

      - name: Install shellcheck (POSIX runners)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            :
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y shellcheck
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            echo "shellcheck is unavailable on $RUNNER_OS" >&2
            exit 1
          fi

      - name: POSIX shell syntax and lint
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for script in installer/*.sh tools/*.sh; do
            sh -n "$script"
            shellcheck --shell=sh "$script"
          done

      - name: PowerShell parse check
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          $files = Get-ChildItem -Path 'client\ps', 'installer', 'tools' -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Output "Parse errors in $($file.FullName)"
              $errors | ForEach-Object { Write-Output $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  runtime-smoke:
    name: VS Code runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          npm install --no-save --no-package-lock @vscode/test-electron@3.1.0

      - name: Run real VS Code Extension Host smoke
        run: xvfb-run -a node tests/run-runtime-smoke.js
        env:
          SESSBRIDGE_TEST_VSCODE_VERSION: "1.136.1"

  vsix:
    name: Build release artifacts
    runs-on: ubuntu-latest
    env:
      VSCE_VERSION: 3.9.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package extension (.vsix)
        run: sh installer/build-vsix.sh

      - name: Build Python wheel and checksum manifest
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps --force-reinstall dist/*.whl
          sessbridge --help
          python -c "import sessbridge"
          sh tools/make_checksums.sh dist
          ls -la dist/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sessbridge-release-artifacts
          path: dist/*
          if-no-files-found: error
